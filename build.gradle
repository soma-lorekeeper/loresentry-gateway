plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.loresentry'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	implementation 'io.lettuce:lettuce-core'
	// W3C traceparent 전파와 span 생성(Micrometer Tracing + OpenTelemetry bridge, OTLP 전송). LOG_SCHEMA.md 7절
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-restclient-test'
	// 로그는 AppLogger로만 찍는다는 규칙(LOG_SCHEMA.md 5절)을 테스트로 강제한다
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'redis' }
}

// Requires isolated Redis and Valkey instances; see README.md (Redis·Valkey 통합 테스트).
tasks.register('sessionIntegrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'redis' }
    shouldRunAfter test
}
