spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s
  mvc:
    async:
      request-timeout: 180s
    servlet:
      # DispatcherServlet을 첫 요청이 아니라 기동할 때 준비한다. 첫 요청(보통 kubelet 헬스체크)이 그 준비 비용을 치르지 않고, 준비 줄
      # ("Initializing Servlet ...")이 헬스체크 trace(collector가 버린다)에 붙어 APM에 없는 span을 가리키지 않는다
      load-on-startup: 1
  lifecycle:
    timeout-per-shutdown-phase: 150s

server:
  port: 8000
  shutdown: graceful

# 로그: 모든 줄을 ECS JSON 한 줄로 stdout에 쓴다(docs LOG_SCHEMA.md 5절). Logstash가 이 줄을 필드로 펼친다.
logging:
  structured:
    format:
      # Boot 내장 ecs 형식 대신 우리 formatter. log.origin.function·error.type 같은 필드를 이름 충돌 없이 함께 낸다
      console: com.loresentry.gateway.logging.EcsLogFormatter
    ecs:
      service:
        # Kubernetes 이름(LOG_SCHEMA.md 6절). spring.application.name(gateway)과 다르다
        name: gateway-api
        # 이미지 태그(build-<run>-<attempt>). CI가 docker build --build-arg로 넘기고 Dockerfile이 ENV로 둔다
        version: ${APP_VERSION:unknown}

loresentry:
  chat:
    allowed-users: ${LORESENTRY_CHAT_ALLOWED_USERS:}
  http:
    max-connections: ${LORESENTRY_HTTP_MAX_CONNECTIONS:25}
    max-connections-per-route: ${LORESENTRY_HTTP_MAX_CONNECTIONS_PER_ROUTE:5}
